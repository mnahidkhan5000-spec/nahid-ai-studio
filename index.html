<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahid AI Studio Pro Plus - Auto Connect</title>
    <script type="module">
        import { client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";
        window.GradioClient = client;
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .studio-card { background: #1e293b; border: 1px solid #334155; padding: 28px; border-radius: 20px; width: 100%; max-width: 650px; }
        .header-title { font-size: 24px; font-weight: 700; color: #38bdf8; text-align: center; margin-bottom: 10px; }
        .status-badge { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; margin-bottom: 20px; color: #10b981; }
        .status-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 14px; outline: none; }
        .colab-field { border-color: #f59e0b !important; }
        .btn-generate { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .preview-container { margin-top: 20px; text-align: center; min-height: 200px; display: flex; justify-content: center; align-items: center; background: #0f172a; border-radius: 8px; }
        img { max-width: 100%; border-radius: 8px; }
        .download-btn { display: none; background: #10b981; color: white; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="studio-card">
    <div class="header-title">Nahid AI Studio Pro Plus</div>
    
    <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">কোল্যাব ইঞ্জিনের সাথে যুক্ত হচ্ছে...</span>
    </div>

    <div class="form-group">
        <label>Google Colab API Link (অটো-ডিটেক্টেড / ম্যানুয়াল):</label>
        <input type="text" id="colabUrl" class="colab-field" placeholder="https://xxxx.gradio.live">
    </div>

    <div class="form-group">
        <label>প্রম্পট (Image Prompt):</label>
        <input type="text" id="prompt" placeholder="A futuristic lion king, 8k resolution">
    </div>

    <button class="btn-generate" onclick="generateImage()">ছবি জেনারেট করুন</button>

    <div class="preview-container">
        <div id="loader" style="display:none; color:#38bdf8;">কোল্যাব GPU থেকে ছবি তৈরি হচ্ছে...</div>
        <img id="outputImg" style="display:none;" />
    </div>

    <a id="downloadBtn" class="download-btn" download="Nahid_AI_Image.png">ছবি ডাউনলোড করুন</a>
</div>

<script>
// পেজ লোড হলে সেভ হওয়া লিঙ্ক এবং ইনপুট ফিল্ড আপডেট করবে
window.onload = function() {
    const savedUrl = localStorage.getItem('nahid_colab_url');
    if (savedUrl) {
        document.getElementById('colabUrl').value = savedUrl;
        updateStatus(true, "কোল্যাব লিঙ্ক প্রস্তুত!");
    } else {
        updateStatus(false, "কোল্যাব লিঙ্ক পেস্ট করুন");
    }
};

function updateStatus(isReady, message) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    text.innerText = message;
    if (isReady) {
        dot.style.backgroundColor = '#10b981';
        text.style.color = '#10b981';
    } else {
        dot.style.backgroundColor = '#f59e0b';
        text.style.color = '#f59e0b';
    }
}

async function generateImage() {
    const prompt = document.getElementById('prompt').value.trim();
    let colabUrl = document.getElementById('colabUrl').value.trim();
    const loader = document.getElementById('loader');
    const outputImg = document.getElementById('outputImg');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!prompt) {
        alert('অনুগ্রহ করে একটি প্রম্পট দিন!');
        return;
    }

    if (!colabUrl) {
        alert('কোল্যাবের লিঙ্ক প্রদান করুন!');
        return;
    }

    if (colabUrl.endsWith('/')) {
        colabUrl = colabUrl.slice(0, -1);
    }

    // প্রতিবার নতুন লিঙ্ক ইনপুট দিলে ব্রাউজারে অটো সেভ হয়ে যাবে
    localStorage.setItem('nahid_colab_url', colabUrl);

    loader.style.display = 'block';
    outputImg.style.display = 'none';
    downloadBtn.style.display = 'none';

    try {
        const app = await window.GradioClient.connect(colabUrl);
        const result = await app.predict("/predict", [prompt]);

        if (result && result.data && result.data[0]) {
            const imgData = result.data[0];
            const imgUrl = imgData.url || imgData;

            outputImg.src = imgUrl;
            outputImg.style.display = 'block';

            downloadBtn.href = imgUrl;
            downloadBtn.style.display = 'block';
            loader.style.display = 'none';
            updateStatus(true, "ছবি সফলভাবে তৈরি হয়েছে!");
        } else {
            throw new Error("Invalid response");
        }
    } catch (err) {
        console.error(err);
        alert('কোল্যাব সেশন বা লিঙ্ক ফুরিয়ে গেছে! অনুগ্রহ করে কোল্যাব থেকে নতুন লিঙ্ক এনে পেস্ট করুন।');
        loader.style.display = 'none';
        updateStatus(false, "ডিসকানেক্টেড! লিঙ্ক রিফ্রেশ করুন");
    }
}
</script>

</body>
</html>
