<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahid AI Studio Pro Plus</title>
    <style>
        body {
            background-color: #020617;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            width: 100%;
            max-width: 600px;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { color: #60a5fa; text-align: center; margin-bottom: 5px; }
        p { color: #94a3b8; text-align: center; font-size: 12px; margin-bottom: 20px; }
        label { display: block; color: #93c5fd; font-size: 12px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
        textarea, select {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 90px; }
        button {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { opacity: 0.9; }
        .result {
            margin-top: 15px;
            background: #020617;
            border: 1px solid #22c55e;
            border-radius: 8px;
            padding: 12px;
            color: #4ade80;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Nahid AI Studio Pro Plus</h2>
        <p>⚡ Ultimate Midjourney V6 & High-Scale Crystal Engine</p>

        <label>Enter Your Masterpiece Prompt:</label>
        <textarea id="myPrompt">A breathtaking crystal clear 3D/4D hyper-realistic masterpiece portrait</textarea>

        <label>Select High-Scale Upscale Engine:</label>
        <select id="myEngine">
            <option value="4K Ultra Resolution">4K Ultra Resolution Engine</option>
            <option value="8K Hyper-Detailed Crystal" selected>8K Hyper-Detailed Crystal Engine</option>
            <option value="16K Masterpiece Maximum Scale">16K Masterpiece Maximum Scale</option>
        </select>

        <button onclick="runMasterpiece()">🚀 Generate Masterpiece</button>

        <div class="result" id="resBox"></div>
    </div>

    <script>
        function runMasterpiece() {
            const p = document.getElementById('myPrompt').value;
            const e = document.getElementById('myEngine').value;
            const box = document.getElementById('resBox');

            if(!p.trim()) {
                alert('দয়া করে কিছু লিখুন!');
                return;
            }

            box.style.display = 'block';
            box.innerHTML = `<strong>✨ Success!</strong><br><strong>Engine:</strong> ${e}<br><strong>Prompt:</strong> ${p} --v 6.0`;
        }
    </script>

</body>
            </html>
