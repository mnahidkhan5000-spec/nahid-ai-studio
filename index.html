<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahid AI Pro Studio - Complete Leonardo Engine</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --panel-bg: #111827;
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #ec4899 100%);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding: 20px;
        }

        .studio-container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 2.2rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 800;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ec4899;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .input-field, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }

        .action-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .preview-box {
            margin-top: 30px;
            background: #070a12;
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            min-height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-feature {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            transition: background 0.3s;
        }

        .btn-download {
            background: #10b981;
            color: white;
        }
        .btn-download:hover { background: #059669; }

        .btn-upscale {
            background: #8b5cf6;
            color: white;
        }
        .btn-upscale:hover { background: #7c3aed; }
    </style>
</head>
<body>

    <div class="studio-container">
        <h1>Nahid AI Pro Studio</h1>

        <!-- Prompt Section -->
        <div class="control-group">
            <label for="userPrompt">Prompt (What you want to generate):</label>
            <textarea id="userPrompt" class="input-field" placeholder="A breathtaking cinematic landscape of a floating cyberpunk city, neon lights, highly detailed, 8k resolution..."></textarea>
        </div>

        <!-- Negative Prompt & Model Style -->
        <div class="grid-2">
            <div class="control-group">
                <label for="negativePrompt">Negative Prompt (Avoid elements):</label>
                <input type="text" id="negativePrompt" class="input-field" value="blurry, low quality, distorted, extra limbs, watermark, logo, text">
            </div>
            <div class="control-group">
                <label for="artStyle">Leonardo AI Model / Style:</label>
                <select id="artStyle" class="input-field">
                    <option value="phoenix">Leonardo Phoenix (Ultra Realism)</option>
                    <option value="cinematic">Leonardo Cinematic</option>
                    <option value="anime">Anime / Creative Vibe</option>
                    <option value="cyberpunk">Cyberpunk Neon</option>
                    <option value="photorealistic">Photorealistic 4K</option>
                </select>
            </div>
        </div>

        <!-- Aspect Ratio & CFG Controls -->
        <div class="grid-2">
            <div class="control-group">
                <label for="aspectRatio">Aspect Ratio (Dimensions):</label>
                <select id="aspectRatio" class="input-field">
                    <option value="1024x1024">Square (1:1 - 1024x1024)</option>
                    <option value="1280x720">Landscape (16:9 - 1280x720)</option>
                    <option value="720x1280">Portrait (9:16 - 720x1280)</option>
                    <option value="1024x768">Standard (4:3 - 1024x768)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="guidanceScale">CFG Guidance Scale:</label>
                <input type="number" id="guidanceScale" class="input-field" value="7.5" min="1" max="20" step="0.5">
            </div>
        </div>

        <button class="action-btn" onclick="generateLeonardoImage()">✨ Generate Masterpiece (Logo-Free)</button>

        <!-- Output Canvas -->
        <div class="preview-box" id="outputCanvas">
            <p style="color: var(--text-muted);">আপনার প্রম্পট লিখে জেনারেট বাটনে ক্লিক করুন। লিওনার্দো স্টাইল প্রসেসিং এখানে দেখাবে।</p>
        </div>
    </div>

    <script>
        let currentImageURL = "";
        let currentWidth = 1024;
        let currentHeight = 1024;
        let isUpscaled = false;

        function generateLeonardoImage() {
            const prompt = document.getElementById('userPrompt').value.trim();
            const negPrompt = document.getElementById('negativePrompt').value.trim();
            const style = document.getElementById('artStyle').value;
            const ratio = document.getElementById('aspectRatio').value.split('x');
            currentWidth = parseInt(ratio[0]);
            currentHeight = parseInt(ratio[1]);
            const cfg = document.getElementById('guidanceScale').value;
            const canvas = document.getElementById('outputCanvas');

            if (!prompt) {
                alert('দয়া করে প্রম্পট ফিল্ড পূরণ করুন!');
                return;
            }

            isUpscaled = false;
            canvas.innerHTML = `
                <div style="color: #818cf8; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px;">
                    🔄 Latent Diffusion & Alchemy v4 Processing...
                </div>
                <p style="color: #ec4899; font-size: 0.9rem;">Model: ${style} | Resolution: ${currentWidth}x${currentHeight} | CFG: ${cfg}</p>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">Optimizing neural weights & rendering canvas...</p>
            `;

            setTimeout(() => {
                const combinedPrompt = encodeURIComponent(`${prompt}, ${style} style, ultra detailed, masterpiece, negative: ${negPrompt}`);
                currentImageURL = `https://image.pollinations.ai/prompt/${combinedPrompt}?width=${currentWidth}&height=${currentHeight}&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;

                renderResult(canvas, currentImageURL, false);
            }, 2500);
        }

        // লিওনার্দো স্টাইল আপস্কেল (Upscale) ফিচার
        function upscaleImage() {
            if (!currentImageURL) return;
            const canvas = document.getElementById('outputCanvas');
            
            canvas.innerHTML = `
                <div style="color: #8b5cf6; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px;">
                    ⚡ AI Upscaling & Clarity Enhancement in Progress...
                </div>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Enhancing resolution and details (2x AI Upscale)...</p>
            `;

            setTimeout(() => {
                isUpscaled = true;
                // আপস্কেলিংয়ের জন্য রেজোলিউশন দ্বিগুণ করা হচ্ছে
                let upscaledWidth = currentWidth * 1.5;
                let upscaledHeight = currentHeight * 1.5;
                
                // ইউআরএলের রেজোলিউশন প্যারামিটার আপডেট করা হচ্ছে
                currentImageURL = currentImageURL.replace(`width=${currentWidth}&height=${currentHeight}`, `width=${upscaledWidth}&height=${upscaledHeight}`);
                
                renderResult(canvas, currentImageURL, true);
            }, 2000);
        }

        function renderResult(canvasElement, imgUrl, upscaledStatus) {
            canvasElement.innerHTML = `
                <p style="color: #10b981; font-weight: bold; font-size: 1.05rem; margin-bottom: 12px;">
                    ✔ ${upscaledStatus ? 'Image Upscaled & Enhanced (HD)' : 'Masterpiece Generated Successfully (Logo-Free)'}
                </p>
                <img id="generatedImg" src="${imgUrl}" alt="AI Masterpiece" crossorigin="anonymous">
                <div class="btn-container">
                    <button class="btn-feature btn-upscale" onclick="upscaleImage()">⚡ AI Upscale (HD)</button>
                    <a href="${imgUrl}" target="_blank" download="nahid-ai-masterpiece.jpg" class="btn-feature btn-download">⬇ Download Image</a>
                </div>
                <p style="margin-top: 12px; font-size: 0.8rem; color: var(--text-muted);">Status: ${upscaledStatus ? 'Upscaled High-Resolution' : 'Standard Resolution'}</p>
            `;
        }
    </script>
</body>
</html>
