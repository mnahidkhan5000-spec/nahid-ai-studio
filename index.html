<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahid AI Studio Pro Plus - Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .studio-card {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.98);
            border: 2px solid #3b82f6;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #60a5fa; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 12px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #93c5fd; font-size: 12px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
        textarea, select {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }
        textarea { resize: vertical; min-height: 90px; }
        textarea:focus, select:focus { border-color: #60a5fa; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .generate-btn:hover { opacity: 0.9; }
        .result-container {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .loader {
            color: #60a5fa;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .output-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #22c55e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            background: #22c55e;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }
        .download-btn:hover { background: #16a34a; }
        .engine-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            display: inline-block;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="studio-card">
        <div class="header">
            <h1>Nahid AI Studio Pro Plus</h1>
            <p>⚡ Ultimate Image Generator & Upscale Engine</p>
        </div>

        <div class="form-group">
            <label>Enter Your Masterpiece Prompt:</label>
            <textarea id="promptInput">A professional business team collaborating in a modern office, hyper-realistic, 8k resolution</textarea>
        </div>

        <div class="form-group">
            <label>Select High-Scale Upscale Engine:</label>
            <select id="engineSelect">
                <option value="4K Ultra Resolution, sharp details">4K Ultra Resolution Engine</option>
                <option value="8K Hyper-Detailed Crystal, photorealistic masterpiece" selected>8K Hyper-Detailed Crystal Engine</option>
                <option value="16K Masterpiece Maximum Scale, extreme sharpness, unreal engine 5">16K Masterpiece Maximum Scale Engine</option>
            </select>
        </div>

        <button class="generate-btn" id="genBtn" onclick="generateMasterpieceImage()">🚀 Generate Masterpiece</button>

        <div class="result-container" id="resultContainer">
            <div class="loader" id="loaderText">⚙️ Applying Upscale Engine & Rendering Image...</div>
            <div id="engineInfo" class="engine-badge"></div>
            <br>
            <img id="outputImg" class="output-image" alt="Upscaled AI Masterpiece" style="display:none;" onload="imageReady()">
            <br>
            <a id="downloadLink" class="download-btn" style="display:none;" target="_blank">📥 Download High-Res Image</a>
        </div>
    </div>

    <script>
        function generateMasterpieceImage() {
            const promptText = document.getElementById('promptInput').value.trim();
            const engineSelect = document.getElementById('engineSelect');
            const selectedEngineName = engineSelect.options[engineSelect.selectedIndex].text;
            const engineValue = engineSelect.value;
            
            const container = document.getElementById('resultContainer');
            const loader = document.getElementById('loaderText');
            const imgElement = document.getElementById('outputImg');
            const downloadLink = document.getElementById('downloadLink');
            const engineBadge = document.getElementById('engineInfo');
            const btn = document.getElementById('genBtn');

            if (!promptText) {
                alert('দয়া করে একটি প্রম্পট লিখুন!');
                return;
            }

            container.style.display = 'block';
            loader.style.display = 'block';
            imgElement.style.display = 'none';
            downloadLink.style.display = 'none';
            engineBadge.style.display = 'none';
            btn.disabled = true;
            btn.style.opacity = '0.6';

            // Combining user prompt with selected upscale engine keywords
            const fullPrompt = `${promptText}, ${engineValue}, --v 6.0`;
            const encodedPrompt = encodeURIComponent(fullPrompt);
            
            // Image generation API endpoint with customized dimensions
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 9999999)}`;

            engineBadge.innerText = `Active Engine: ${selectedEngineName}`;
            imgElement.src = imageUrl;
            downloadLink.href = imageUrl;
        }

        function imageReady() {
            document.getElementById('loaderText').style.display = 'none';
            document.getElementById('outputImg').style.display = 'block';
            document.getElementById('downloadLink').style.display = 'inline-block';
            document.getElementById('engineInfo').style.display = 'inline-block';
            
            const btn = document.getElementById('genBtn');
            btn.disabled = false;
            btn.style.opacity = '1';
        }
    </script>

</body>
</html>
