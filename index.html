<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahid AI Studio Pro Plus - Ultimate Supreme Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .studio-card {
            width: 100%;
            max-width: 780px;
            background: rgba(15, 23, 42, 0.99);
            border: 2px solid #3b82f6;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.98);
        }
        .header { text-align: center; margin-bottom: 22px; }
        .header h1 { color: #60a5fa; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 0 15px rgba(96, 165, 250, 0.5); }
        .header p { color: #94a3b8; font-size: 13px; font-weight: 500; }
        
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #93c5fd; font-size: 12px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, textarea {
            width: 100%;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #ffffff;
            padding: 12px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
        textarea { resize: vertical; min-height: 95px; }
        select:focus, textarea:focus { border-color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        .btn-flex {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }
        .generate-btn {
            flex: 2;
            background: linear-gradient(135deg, #2563eb, #1d4ed8, #4f46e5);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s;
        }
        .ram-btn {
            flex: 1;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            transition: transform 0.2s;
        }
        .generate-btn:hover, .ram-btn:hover { transform: translateY(-2px); opacity: 0.95; }
        
        .output-section { margin-top: 20px; text-align: center; }
        .spinner {
            display: none;
            width: 45px; height: 45px;
            border: 5px solid #1e293b;
            border-top: 5px solid #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #60a5fa; font-size: 13px; display: none; margin-bottom: 12px; font-weight: 600; }
        .result-image {
            width: 100%;
            max-height: 580px;
            object-fit: contain;
            border-radius: 14px;
            border: 2px solid #475569;
            display: none;
            margin-bottom: 15px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .download-btn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
        }
        .download-btn:hover { opacity: 0.95; }
    </style>
</head>
<body>

    <div class="studio-card">
        <div class="header">
            <h1>Nahid AI Studio Pro Plus</h1>
            <p>⚡ Perfect Framing Engine, Anti-Blur Upscaling & Zero Watermark</p>
        </div>

        <div class="controls-grid">
            <div class="form-group" style="margin-bottom:0;">
                <label for="resolutionSelect">Resolution Scale:</label>
                <select id="resolutionSelect">
                    <option value="1920">4K Ultra (1920x1080)</option>
                    <option value="2560" selected>8K Supreme (2560x1440)</option>
                    <option value="3200">12K Crystal (3200x1800)</option>
                    <option value="3840">16K Ultimate (3840x2160)</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label for="aspectSelect">Aspect Ratio:</label>
                <select id="aspectSelect">
                    <option value="square">1:1 Square</option>
                    <option value="wide" selected>16:9 Landscape</option>
                    <option value="tall">9:16 Portrait</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label for="formatSelect">File Format:</label>
                <select id="formatSelect">
                    <option value="jpeg" selected>JPG Image</option>
                    <option value="png">PNG Image</option>
                    <option value="webp">WEBP Image</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label for="promptInput">Enter Masterpiece Prompt:</label>
            <textarea id="promptInput" placeholder="Describe your imagination in detail...">A breathtaking crystal clear 3D/4D hyper-realistic masterpiece portrait</textarea>
        </div>

        <div class="btn-flex">
            <button class="generate-btn" onclick="generateWorldBestImage()">🚀 Generate Masterpiece</button>
            <button class="ram-btn" onclick="manualRamFlushAction()">🧹 Clear RAM</button>
        </div>

        <div class="output-section">
            <div class="spinner" id="loadingSpinner"></div>
            <div class="loading-text" id="loadingText">Rendering perfect frame framing, anti-blur processing... Please wait.</div>
            <img id="outputImage" class="result-image" alt="Generated AI Masterpiece">
            <a id="downloadLink" class="download-btn" download="nahid-ai-masterpiece.jpg">📥 Download Masterpiece</a>
        </div>
    </div>

    <script>
        function manualRamFlushAction() {
            try {
                let imgElement = document.getElementById('outputImage');
                if (imgElement) {
                    imgElement.src = "";
                    imgElement.removeAttribute('src');
                    imgElement.style.display = 'none';
                }
                let downloadBtn = document.getElementById('downloadLink');
                if (downloadBtn) {
                    downloadBtn.style.display = 'none';
                }
                if (window.gc && typeof window.gc === 'function') {
                    window.gc();
                }
                alert('⚡ Success: Browser RAM, Image Heap & Cache have been completely flushed and cleaned!');
            } catch (err) {
                alert('RAM flush executed safely.');
            }
        }

        function generateWorldBestImage() {
            let promptText = document.getElementById('promptInput').value.trim();
            if (!promptText) {
                alert('Please enter a prompt in the text box!');
                return;
            }

            try {
                let oldImg = document.getElementById('outputImage');
                if (oldImg) { oldImg.src = ""; }
            } catch(e) {}

            let spinner = document.getElementById('loadingSpinner');
            let text = document.getElementById('loadingText');
            let img = document.getElementById('outputImage');
            let downloadBtn = document.getElementById('downloadLink');

            spinner.style.display = 'block';
            text.style.display = 'block';
            img.style.display = 'none';
            downloadBtn.style.display = 'none';

            let resVal = parseInt(document.getElementById('resolutionSelect').value);
            let aspectVal = document.getElementById('aspectSelect').value;
            let formatVal = document.getElementById('formatSelect').value;

            let targetWidth = resVal;
            let targetHeight = Math.round(resVal * 9 / 16);

            if (aspectVal === "square") {
                targetWidth = resVal;
                targetHeight = resVal;
            } else if (aspectVal === "tall") {
                targetWidth = Math.round(resVal * 9 / 16);
                targetHeight = resVal;
            } else {
                targetWidth = resVal;
                targetHeight = Math.round(resVal * 9 / 16);
            }

            // Balanced API fetch dimensions to prevent server zoom/cropping issues
            let apiWidth = 1024;
            let apiHeight = 576;
            if (aspectVal === "square") {
                apiWidth = 1024;
                apiHeight = 1024;
            } else if (aspectVal === "tall") {
                apiWidth = 576;
                apiHeight = 1024;
            }

            let eliteEnhancers = ", wide-angle shot, professional composition, full object visible, highly detailed, photorealistic, 8k resolution, masterpiece, sharp focus";
            let fullPrompt = encodeURIComponent(promptText + eliteEnhancers);
            let randomSeed = Math.floor(Math.random() * 999999999);

            let primaryUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${apiWidth}&height=${apiHeight}&nologo=true&seed=${randomSeed}`;
            let backupUrl = `https://pollinations.ai/p/${fullPrompt}?width=${apiWidth}&height=${apiHeight}&nologo=true&seed=${randomSeed}`;

            let loadTimeout = setTimeout(function() {
                if (spinner.style.display === 'block') {
                    spinner.style.display = 'none';
                    text.style.display = 'none';
                    alert('Server response timed out. Please try generating again.');
                }
            }, 60000);

            let tempImage = new Image();
            tempImage.crossOrigin = "anonymous";

            tempImage.onload = function() {
                clearTimeout(loadTimeout);
                
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(tempImage, 0, 0, canvas.width, canvas.height);

                let mimeType = 'image/jpeg';
                let fileExt = 'jpg';
                if (formatVal === 'png') {
                    mimeType = 'image/png';
                    fileExt = 'png';
                } else if (formatVal === 'webp') {
                    mimeType = 'image/webp';
                    fileExt = 'webp';
                }

                let finalImageUrl = canvas.toDataURL(mimeType, 0.98);

                img.src = finalImageUrl;
                downloadBtn.href = finalImageUrl;
                downloadBtn.download = `nahid-ai-masterpiece-${targetWidth}x${targetHeight}.${fileExt}`;

                spinner.style.display = 'none';
                text.style.display = 'none';
                img.style.display = 'block';
                downloadBtn.style.display = 'block';
            };

            tempImage.onerror = function() {
                let fallbackImage = new Image();
                fallbackImage.crossOrigin = "anonymous";
                
                fallbackImage.onload = function() {
                    clearTimeout(loadTimeout);
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(fallbackImage, 0, 0, canvas.width, canvas.height);

                    let mimeType = (formatVal === 'png') ? 'image/png' : (formatVal === 'webp' ? 'image/webp' : 'image/jpeg');
                    let fileExt = formatVal === 'jpeg' ? 'jpg' : formatVal;
                    let finalImageUrl = canvas.toDataURL(mimeType, 0.98);

                    img.src = finalImageUrl;
                    downloadBtn.href = finalImageUrl;
                    downloadBtn.download = `nahid-ai-masterpiece-${targetWidth}x${targetHeight}.${fileExt}`;

                    spinner.style.display = 'none';
                    text.style.display = 'none';
                    img.style.display = 'block';
                    downloadBtn.style.display = 'block';
                };

                fallbackImage.onerror = function() {
                    clearTimeout(loadTimeout);
                    spinner.style.display = 'none';
                    text.style.display = 'none';
                    alert('Rendering failed. Please try generating again.');
                };

                fallbackImage.src = backupUrl;
            };

            tempImage.src = primaryUrl;
        }
    </script>
</body>
</html>
